services:
  - type: web
    name: driplab
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
